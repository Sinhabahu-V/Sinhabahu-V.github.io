<header class="journal-header">
    <div class="journal-rule" aria-hidden="true"></div>
    <div class="masthead">
        <a class="lion-mark" href="{{ site.Home.RelPermalink }}" aria-label="Sinhabahu home">S</a>
        <a class="journal-wordmark" href="{{ site.Home.RelPermalink }}">SINHABAHU</a>
        <span class="journal-kicker">Essays on power,<br>sovereignty &amp; statecraft</span>
    </div>
    <nav class="journal-nav" aria-label="Primary navigation">
        <ul id="menu">
            {{- range .Site.Menus.main }}
            <li><a href="{{ .URL | absURL }}">{{ .Name }}</a></li>
            {{- end }}
        </ul>
    </nav>
</header>
